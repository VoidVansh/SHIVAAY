[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shivaay-memory"
version = "0.1.0"
description = "Local-first adaptive persistent memory engine for SHIVAAY"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SHIVAAY contributors" }]
dependencies = []

[project.scripts]
shivaay-memory = "shivaay_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
